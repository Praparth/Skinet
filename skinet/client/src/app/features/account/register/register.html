<mat-card class="max-w-lg mx-auto mt-32 p-8 bg-white">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-semibold text-primary">Register</h2>
    </div>

    <app-text-input label="First Name" formControlName="firstName" />
    <app-text-input label="Last Name" formControlName="lastName" />
    <app-text-input label="Email" formControlName="email" />
    <app-text-input label="Password" type="password" formControlName="password" />

    @if (submitted && validationErrors){
      <div class="mb-3 p-4 bg-red-100 text-red-700 rounded">
        <ul class="list-disc px-3">
          @for (error of validationErrors; track $index) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }

    <button [disabled]="registerForm.invalid" mat-flat-button color="primary" type="submit" class="w-full py-2">
      Register
    </button>
  </form>
</mat-card>
